[project]
name = "india-openrisk"
version = "0.1.0"
description = "Pre-market U.S.-to-India opening-risk intelligence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.0.0",
    "statsmodels>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
app = [
    "plotly>=5.0.0",
    "streamlit>=1.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
